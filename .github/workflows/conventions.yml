name: Commit conventions
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, milestoned, demilestoned]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PR title and commit subjects
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()]+\))?!?: .+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo '::error::Use a Conventional Commit PR title, for example feat(theme): add navigation'
            exit 1
          fi
          while IFS= read -r sha; do
            subject=$(git show -s --format=%s "$sha")
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Commit $sha needs a Conventional Commit subject"
              exit 1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
      - name: Validate PR labels and milestone
        shell: bash
        run: |
          set -euo pipefail
          type_count=0
          area_count=0
          semver_count=0
          invalid_labels=()

          while IFS= read -r label; do
            case "$label" in
              type:feature|type:fix|type:docs|type:refactor|type:maintenance|type:ci) type_count=$(( type_count + 1 )) ;;
              area:admin|area:flux|area:front-end|area:editor|area:contact|area:seo|area:dependencies|area:deployment|area:accessibility|area:release) area_count=$(( area_count + 1 )) ;;
              semver:major|semver:minor|semver:patch|semver:none) semver_count=$(( semver_count + 1 )) ;;
              type:*|area:*|semver:*) invalid_labels+=("$label") ;;
            esac
          done < <(jq -r '.pull_request.labels[]?.name' "$GITHUB_EVENT_PATH")

          if [[ "${#invalid_labels[@]}" -gt 0 ]]; then
            echo "::error::Unsupported workflow label(s): ${invalid_labels[*]}"
            exit 1
          fi

          if [[ "$type_count" -ne 1 ]]; then
            echo '::error::Add exactly one type:* label to this PR.'
            exit 1
          fi
          if [[ "$area_count" -lt 1 ]]; then
            echo '::error::Add at least one area:* label to this PR.'
            exit 1
          fi
          if [[ "$semver_count" -ne 1 ]]; then
            echo '::error::Add exactly one semver:* label to this PR.'
            exit 1
          fi
          if ! jq -e '.pull_request.milestone != null' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo '::error::Assign this PR to a release, initiative or maintenance milestone.'
            exit 1
          fi
