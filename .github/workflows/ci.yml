name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.8.12
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n 1 php -l
      - run: composer lint
      - run: node --check assets/seo.js
  integration:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:10.11.19
        env:
          MARIADB_ROOT_PASSWORD: testing
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:2.8.12, wp-cli:2.12.0
          extensions: mysqli
      - run: composer install --no-dev --no-interaction --prefer-dist
      - name: Prepare isolated WordPress
        run: |
          wp core download --version=7.1.3 --path=/tmp/aeon-wordpress
          wp config create --path=/tmp/aeon-wordpress --dbname=wordpress --dbuser=root --dbpass=testing --dbhost=127.0.0.1
          wp core install --path=/tmp/aeon-wordpress --url=http://aeon.test --title=Tests --admin_user=testing --admin_password=temporary-ci-password --admin_email=testing@example.test --skip-email
          mkdir -p /tmp/aeon-wordpress/wp-content/themes/aeon-test
          printf '/* Theme Name: Aeon test theme */\n' > /tmp/aeon-wordpress/wp-content/themes/aeon-test/style.css
          printf '<?php // Test fallback.\n' > /tmp/aeon-wordpress/wp-content/themes/aeon-test/index.php
          ln -s "$GITHUB_WORKSPACE" /tmp/aeon-wordpress/wp-content/plugins/aeon
          wp theme activate aeon-test --path=/tmp/aeon-wordpress
          wp plugin activate aeon --path=/tmp/aeon-wordpress
      - run: WP_PATH=/tmp/aeon-wordpress sh tests/integration.sh
      - run: WP_PATH=/tmp/aeon-wordpress sh tests/seo.sh
      - run: WP_PATH=/tmp/aeon-wordpress sh tests/comments.sh
      - run: wp eval-file tests/contact.php --path=/tmp/aeon-wordpress
      - run: WP_PATH=/tmp/aeon-wordpress sh tests/editor.sh
